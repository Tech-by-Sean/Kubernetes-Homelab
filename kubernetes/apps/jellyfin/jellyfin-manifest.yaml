apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # This connects the pod to the patched containerd runtime
      runtimeClassName: nvidia 
      # Ensures the pod has the correct permissions for NFS and hardware
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: jellyfin
          image: linuxserver/jellyfin:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            # FIX: Tells Jellyfin exactly where its transcoding engine is
            - name: JELLYFIN_FFmpeg__path
              value: "/usr/lib/jellyfin-ffmpeg/ffmpeg"
            # FIX: Points FFmpeg to the NVIDIA libraries we are mounting from Talos
            - name: LD_LIBRARY_PATH
              value: "/usr/lib/x86_64-linux-gnu/nvidia"
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/movies
            - name: shows
              mountPath: /media/shows
            # The "Surgical Mount": Maps Talos drivers into the container
            - name: nvidia-libs
              mountPath: /usr/lib/x86_64-linux-gnu/nvidia
              readOnly: true
            # Required for HDR Tone Mapping on the P1000
            - name: render-node
              mountPath: /dev/dri/renderD128
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4000m" # Increased for 4K handling
              memory: "8Gi"
            requests:
              nvidia.com/gpu: 1
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: movies
          persistentVolumeClaim:
            claimName: jellyfin-movies
        - name: shows
          persistentVolumeClaim:
            claimName: jellyfin-shows
        # This hostPath is standard for the Talos NVIDIA extension
        - name: nvidia-libs
          hostPath:
            path: /usr/local/glibc/usr/lib
        # Maps the actual GPU hardware node
        - name: render-node
          hostPath:
            path: /dev/dri/renderD128
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin.servers.local`) || Host(`jellyfin.techbysean.com`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096