apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Use the runtime bridge we configured—this handles library injection safely
      runtimeClassName: nvidia 
      # Fixes permissions for NFS storage access
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: jellyfin
          image: linuxserver/jellyfin:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            # Setting to all ensures NVENC and NVDEC are both active
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            # Standard path where the NVIDIA Toolkit injects libraries
            - name: LD_LIBRARY_PATH
              value: "/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/movies
            - name: shows
              mountPath: /media/shows
            # Required for OpenCL/HDR Tone Mapping on your P1000
            - name: render-node
              mountPath: /dev/dri/renderD128
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4000m"
              memory: "8Gi"
            requests:
              nvidia.com/gpu: 1
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: movies
          persistentVolumeClaim:
            claimName: jellyfin-movies
        - name: shows
          persistentVolumeClaim:
            claimName: jellyfin-shows
        # Direct hardware access to the GPU render node
        - name: render-node
          hostPath:
            path: /dev/dri/renderD128
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin.servers.local`) || Host(`jellyfin.techbysean.com`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096