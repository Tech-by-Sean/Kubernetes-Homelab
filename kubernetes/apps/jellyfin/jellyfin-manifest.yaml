apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # This bridge connects the Pod to the custom containerd runtime
      runtimeClassName: nvidia 
      containers:
        - name: jellyfin
          image: linuxserver/jellyfin:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
            # Crucial for Talos: Forces the app to find the mounted drivers
            - name: LD_LIBRARY_PATH
              value: "/usr/lib/x86_64-linux-gnu/nvidia"
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/movies
            - name: shows
              mountPath: /media/shows
            # The "Surgical Mount": maps host drivers into the container
            - name: nvidia-libs
              mountPath: /usr/lib/x86_64-linux-gnu/nvidia
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "2000m"
              memory: "8Gi"
            requests:
              nvidia.com/gpu: 1
              cpu: "500m"
              memory: "2Gi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: movies
          persistentVolumeClaim:
            claimName: jellyfin-movies
        - name: shows
          persistentVolumeClaim:
            claimName: jellyfin-shows
        # This hostPath is standard for the Talos NVIDIA extension
        - name: nvidia-libs
          hostPath:
            path: /usr/local/glibc/usr/lib
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin.servers.local`) || Host(`jellyfin.techbysean.com`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096